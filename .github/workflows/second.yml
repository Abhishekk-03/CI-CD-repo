name: Install Dependencies

on:
  push:
  workflow_dispatch:

jobs:
  installation:
    runs-on: ubuntu-latest

    steps:
    #Checkout current code 
      - name: Get Code
        uses: actions/checkout@v7

    #install python with sepcific version
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

    #Verify Python version
      - name: Check Python Version
        run: python3 --version

    #Install all dependencies
      - name: Install libraries
        run: pip install -r requirement.txt

    #Verify all libraries
      - name: Check libraries Version
        run: pip list

    #Execute all test cases 
      - name: run test cases
        run: pytest

  Deploying:
    needs: installation
    runs-on: ubuntu-latest
    steps:
    #Checkout current code 
      - name: Get Code
        uses: actions/checkout@v7

    #install python with sepcific version
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

    #Install all dependencies
      - name: Install libraries
        run: pip install -r requirement.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t calculator-app:v1 .

      - name: Tag Docker Image
        run: |
          docker tag calculator-app:v1 093831816348.dkr.ecr.eu-north-1.amazonaws.com/first-registry:v1

      - name: Push Docker Image
        run: |
          docker push 093831816348.dkr.ecr.eu-north-1.amazonaws.com/first-registry:v1